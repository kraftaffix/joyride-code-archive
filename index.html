<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Promo Code Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161922;
            --bg-tertiary: #1e212b;
            --bg-elevated: #252a36;
            --border: #2a2f3c;
            --border-hover: #3a4052;
            --text-primary: #e8eaf0;
            --text-secondary: #8b92a8;
            --text-muted: #5a6078;
            --accent: #00d4aa;
            --accent-dim: rgba(0, 212, 170, 0.1);
            --accent-glow: rgba(0, 212, 170, 0.3);
            --danger: #ff4757;
            --danger-dim: rgba(255, 71, 87, 0.1);
            --warning: #ffa502;
            --warning-dim: rgba(255, 165, 2, 0.1);
            --success: #2ed573;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Background decoration */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(0, 212, 170, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), #00b894);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-text p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #00e6b8;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-danger {
            color: var(--danger);
            border-color: rgba(255, 71, 87, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger-dim);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-icon {
            padding: 8px;
            width: 36px;
            height: 36px;
            justify-content: center;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            transition: all 0.2s;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Search & Filter */
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            font-size: 0.9rem;
        }

        .filter-select {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            min-width: 140px;
        }

        .filter-select:focus {
            border-color: var(--accent);
        }

        /* Voucher Cards */
        .voucher-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .voucher-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .voucher-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .voucher-card:hover::before { opacity: 1; }
        .voucher-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow);
            transform: translateX(4px);
        }

        .voucher-card.expired { opacity: 0.6; }
        .voucher-card.expired::before { background: var(--text-muted); }

        .voucher-card.used::before { background: var(--warning); }

        .voucher-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-dim);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .voucher-info {
            flex: 1;
            min-width: 0;
        }

        .voucher-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .voucher-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .voucher-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 100px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-active { background: var(--accent-dim); color: var(--accent); }
        .badge-expired { background: rgba(90, 96, 120, 0.2); color: var(--text-muted); }
        .badge-used { background: var(--warning-dim); color: var(--warning); }
        .badge-expiring { background: rgba(255, 71, 87, 0.15); color: var(--danger); animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .voucher-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 10px;
        }

        .voucher-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .voucher-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .code-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .code-display {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            border: 1px dashed var(--border);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: var(--accent);
            user-select: all;
        }

        .voucher-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            min-width: 280px;
        }

        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container { padding: 20px 16px; }
            header { flex-direction: column; align-items: flex-start; }
            .voucher-card { flex-direction: column; }
            .voucher-actions { width: 100%; justify-content: flex-end; }
            .form-row { grid-template-columns: 1fr; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
    </style>
<base target="_blank">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <div class="brand">
                <div class="brand-icon">🚇</div>
                <div class="brand-text">
                    <h1>kraftaffix's promo code archive</h1>
                    <p>promo codes that I found on the internet</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-sm" onclick="exportData()">📥 Export</button>
                <label class="btn btn-sm" style="cursor:pointer;">
                    📤 Import
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
                </label>
                <button class="btn btn-primary" onclick="openModal()">+ Add Voucher</button>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Codes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statActive">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statExpiring">0</div>
                <div class="stat-label">Expiring Soon</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statSaved">₱0</div>
                <div class="stat-label">Est. Savings</div>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search vouchers..." oninput="renderVouchers()">
            </div>
            <select class="filter-select" id="filterStatus" onchange="renderVouchers()">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="expiring">Expiring Soon</option>
                <option value="expired">Expired</option>
                <option value="used">Used</option>
            </select>
            <select class="filter-select" id="sortBy" onchange="renderVouchers()">
                <option value="newest">Newest First</option>
                <option value="expiry">Expiry Date</option>
                <option value="discount">Discount Value</option>
            </select>
        </div>

        <div class="voucher-list" id="voucherList">
            <!-- Vouchers rendered here -->
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add Voucher</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="voucherForm" onsubmit="saveVoucher(event)">
                <input type="hidden" id="voucherId">
                <div class="form-group">
                    <label>Voucher Name</label>
                    <input type="text" id="vName" placeholder="e.g. Grab 50% Off" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="vDesc" placeholder="e.g. Valid for rides within Metro Manila"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Promo Code</label>
                        <input type="text" id="vCode" placeholder="GRAB50" required>
                    </div>
                    <div class="form-group">
                        <label>Discount Value</label>
                        <input type="text" id="vDiscount" placeholder="50% or ₱100">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>App / Service</label>
                        <select id="vApp">
                            <option value="🚗">🚗 Grab</option>
                            <option value="🛵">🛵 Angkas</option>
                            <option value="🚌">🚌 JoyRide</option>
                            <option value="🚕">🚕 Uber</option>
                            <option value="🚲">🚲 Move It</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="date" id="vExpiry">
                    </div>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="vStatus">
                        <option value="active">Active</option>
                        <option value="used">Used</option>
                        <option value="expired">Expired</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Voucher</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const STORAGE_KEY = 'transit_vouchers';
        let vouchers = [];

        // Init
        function init() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try { vouchers = JSON.parse(stored); } catch(e) {}
            }
            renderVouchers();
        }

        function saveStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(vouchers));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function getStatus(v) {
            if (v.status === 'used') return 'used';
            if (!v.expiry) return 'active';
            const today = new Date();
            today.setHours(0,0,0,0);
            const exp = new Date(v.expiry);
            const diff = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
            if (diff < 0) return 'expired';
            if (diff <= 3) return 'expiring';
            return 'active';
        }

        function getStatusBadge(status) {
            const map = {
                active: '<span class="voucher-badge badge-active">Active</span>',
                expiring: '<span class="voucher-badge badge-expiring">Expiring Soon</span>',
                expired: '<span class="voucher-badge badge-expired">Expired</span>',
                used: '<span class="voucher-badge badge-used">Used</span>'
            };
            return map[status] || map.active;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'No expiry';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getDaysLeft(dateStr) {
            if (!dateStr) return null;
            const today = new Date();
            today.setHours(0,0,0,0);
            const exp = new Date(dateStr);
            return Math.ceil((exp - today) / (1000 * 60 * 60 * 24));
        }

        function renderVouchers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterStatus').value;
            const sort = document.getElementById('sortBy').value;
            const list = document.getElementById('voucherList');

            let filtered = vouchers.filter(v => {
                const status = getStatus(v);
                if (filter !== 'all' && status !== filter) return false;
                if (search) {
                    const text = (v.name + ' ' + v.code + ' ' + v.desc + ' ' + v.app).toLowerCase();
                    if (!text.includes(search)) return false;
                }
                return true;
            });

            // Sort
            filtered.sort((a, b) => {
                if (sort === 'newest') return b.createdAt - a.createdAt;
                if (sort === 'expiry') {
                    if (!a.expiry) return 1;
                    if (!b.expiry) return -1;
                    return new Date(a.expiry) - new Date(b.expiry);
                }
                if (sort === 'discount') {
                    const valA = parseFloat(a.discount) || 0;
                    const valB = parseFloat(b.discount) || 0;
                    return valB - valA;
                }
                return 0;
            });

            // Update stats
            const active = vouchers.filter(v => getStatus(v) === 'active').length;
            const expiring = vouchers.filter(v => getStatus(v) === 'expiring').length;
            const totalSavings = vouchers.reduce((sum, v) => sum + (parseFloat(v.discount) || 0), 0);
            document.getElementById('statTotal').textContent = vouchers.length;
            document.getElementById('statActive').textContent = active;
            document.getElementById('statExpiring').textContent = expiring;
            document.getElementById('statSaved').textContent = '₱' + totalSavings.toLocaleString();

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎫</div>
                        <h3>No vouchers found</h3>
                        <p>${search || filter !== 'all' ? 'Try adjusting your filters' : 'Add your first promo code to get started'}</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(v => {
                const status = getStatus(v);
                const daysLeft = getDaysLeft(v.expiry);
                let daysText = '';
                if (daysLeft !== null) {
                    if (daysLeft < 0) daysText = 'Expired';
                    else if (daysLeft === 0) daysText = 'Expires today';
                    else if (daysLeft === 1) daysText = '1 day left';
                    else daysText = daysLeft + ' days left';
                }

                return `
                    <div class="voucher-card ${status === 'expired' ? 'expired' : ''} ${status === 'used' ? 'used' : ''}">
                        <div class="voucher-icon">${v.app || '🎫'}</div>
                        <div class="voucher-info">
                            <div class="voucher-header">
                                <span class="voucher-name">${escapeHtml(v.name)}</span>
                                ${getStatusBadge(status)}
                            </div>
                            <div class="voucher-desc">${escapeHtml(v.desc || 'No description')}</div>
                            <div class="code-box">
                                <span class="code-display">${escapeHtml(v.code)}</span>
                                <button class="btn btn-sm btn-icon" onclick="copyCode('${escapeHtml(v.code)}')" title="Copy">📋</button>
                            </div>
                            <div class="voucher-meta">
                                <span>🏷️ ${escapeHtml(v.discount || 'N/A')}</span>
                                <span>📅 ${formatDate(v.expiry)} ${daysText ? '• ' + daysText : ''}</span>
                            </div>
                        </div>
                        <div class="voucher-actions">
                            <button class="btn btn-sm btn-icon" onclick="editVoucher('${v.id}')" title="Edit">✏️</button>
                            <button class="btn btn-sm btn-icon" onclick="toggleStatus('${v.id}')" title="Mark as used/unused">✓</button>
                            <button class="btn btn-sm btn-icon btn-danger" onclick="deleteVoucher('${v.id}')" title="Delete">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Modal
        function openModal(id = null) {
            document.getElementById('modalTitle').textContent = id ? 'Edit Voucher' : 'Add Voucher';
            document.getElementById('voucherId').value = id || '';
            if (id) {
                const v = vouchers.find(x => x.id === id);
                if (v) {
                    document.getElementById('vName').value = v.name;
                    document.getElementById('vDesc').value = v.desc || '';
                    document.getElementById('vCode').value = v.code;
                    document.getElementById('vDiscount').value = v.discount || '';
                    document.getElementById('vApp').value = v.app || '🚗';
                    document.getElementById('vExpiry').value = v.expiry || '';
                    document.getElementById('vStatus').value = v.status || 'active';
                }
            } else {
                document.getElementById('voucherForm').reset();
                document.getElementById('vApp').value = '🚗';
            }
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function saveVoucher(e) {
            e.preventDefault();
            const id = document.getElementById('voucherId').value;
            const data = {
                id: id || generateId(),
                name: document.getElementById('vName').value.trim(),
                desc: document.getElementById('vDesc').value.trim(),
                code: document.getElementById('vCode').value.trim().toUpperCase(),
                discount: document.getElementById('vDiscount').value.trim(),
                app: document.getElementById('vApp').value,
                expiry: document.getElementById('vExpiry').value,
                status: document.getElementById('vStatus').value,
                createdAt: id ? (vouchers.find(v => v.id === id)?.createdAt || Date.now()) : Date.now()
            };

            if (id) {
                const idx = vouchers.findIndex(v => v.id === id);
                if (idx >= 0) vouchers[idx] = data;
            } else {
                vouchers.push(data);
            }

            saveStorage();
            renderVouchers();
            closeModal();
            showToast(id ? 'Voucher updated!' : 'Voucher added!', 'success');
        }

        function editVoucher(id) {
            openModal(id);
        }

        function deleteVoucher(id) {
            if (!confirm('Delete this voucher?')) return;
            vouchers = vouchers.filter(v => v.id !== id);
            saveStorage();
            renderVouchers();
            showToast('Voucher deleted', 'info');
        }

        function toggleStatus(id) {
            const v = vouchers.find(x => x.id === id);
            if (v) {
                v.status = v.status === 'used' ? 'active' : 'used';
                saveStorage();
                renderVouchers();
                showToast(v.status === 'used' ? 'Marked as used' : 'Marked as active', 'success');
            }
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast('Code copied to clipboard!', 'success');
            }).catch(() => {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = code;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('Code copied to clipboard!', 'success');
            });
        }

        // Export / Import
        function exportData() {
            const data = JSON.stringify(vouchers, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `transit-vouchers-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Vouchers exported!', 'success');
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        vouchers = data;
                        saveStorage();
                        renderVouchers();
                        showToast('Vouchers imported successfully!', 'success');
                    } else {
                        throw new Error('Invalid format');
                    }
                } catch (err) {
                    showToast('Invalid file format', 'error');
                }
                input.value = '';
            };
            reader.readAsText(file);
        }

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Close modal on overlay click
        document.getElementById('modal').addEventListener('click', e => {
            if (e.target === document.getElementById('modal')) closeModal();
        });

        // Escape key
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        // Init
        init();
    </script>
</body>
</html>
